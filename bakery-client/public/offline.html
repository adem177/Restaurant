<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne — Happy Plate</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #120c0a;
        color: #f5ede4;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card { max-width: 26rem; }
      .logo {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 3rem;
        font-weight: 700;
        font-style: italic;
        margin: 0 0 1rem;
      }
      .logo span { color: #c2703d; }
      p { color: rgba(245, 237, 228, 0.6); line-height: 1.6; margin: 0 0 1.75rem; }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        background: #c2703d;
        color: #fff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
      }
      a:hover { background: #a85c2f; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="logo">Happy<span>Plate</span></h1>
      <p>
        Vous êtes hors ligne. Le menu que vous avez déjà consulté reste
        accessible — reconnectez-vous pour commander ou réserver.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
